<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" fill="none" role="img" aria-label="WEIS — World Education & Immigration Services">
  <defs>
    <linearGradient id="badge" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12294d" />
      <stop offset="1" stop-color="#0b1d3a" />
    </linearGradient>
  </defs>

  <!-- Mark -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#badge)" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#1d4ed8" stroke-opacity="0.3" />

  <!-- Globe -->
  <circle cx="32" cy="37" r="12" stroke="#b9c4da" stroke-width="1.3" />
  <ellipse cx="32" cy="37" rx="4.6" ry="12" stroke="#b9c4da" stroke-width="1" />
  <path d="M20.5 37h23" stroke="#b9c4da" stroke-width="1" />
  <path d="M22.5 31h19M22.5 43h19" stroke="#b9c4da" stroke-width="0.85" opacity="0.65" />

  <!-- Mortarboard + cap -->
  <path d="M32 15 L52 23 L32 31 L12 23 Z" fill="#f2b705" />
  <path d="M21 27.5 L43 27.5 L43 34 Q32 38.5 21 34 Z" fill="#d81f2a" />
  <path d="M52 23 L52 35" stroke="#fbcf3b" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="52" cy="36.5" r="1.9" fill="#fbcf3b" />

  <!-- Wordmark -->
  <text x="74" y="34" font-family="'Sora','Segoe UI',system-ui,sans-serif" font-size="27" font-weight="800" fill="#0e1729" letter-spacing="0.5">WEIS</text>
  <text x="75" y="50" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="9" font-weight="600" fill="#4a5568" letter-spacing="2.4">STUDY · WORK · MIGRATE</text>
</svg>
